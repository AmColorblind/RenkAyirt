          package com.renkayirt.oyun;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.view.View;

          import java.util.Collections;
          import java.util.List;

          /** Ekranin tamamini kaplayan, dokunmaya kapali, sadece sembol ciziyen katman. */
          final class OverlayView extends View {

              private volatile List<Detector.Item> items = Collections.emptyList();
              private volatile int capW = 1;
              private volatile int capH = 1;
              private volatile int style = 0;
              private volatile float sizeF = 1f;
              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);

              OverlayView(Context context) {
                  super(context);
              }

              void update(List<Detector.Item> list, int cw, int ch, int st, float sf) {
                  items = list;
                  capW = cw;
                  capH = ch;
                  style = st;
                  sizeF = sf;
                  postInvalidate();
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  List<Detector.Item> list = items;
                  if (list.isEmpty()) return;
                  float sx = getWidth() / (float) capW;
                  float sy = getHeight() / (float) capH;
                  for (Detector.Item it : list) {
                      float r = Detector.symbolRadius(it, sizeF) * sx;
                      if (r < 6f) continue;
                      SymbolPainter.draw(canvas, it.cls, style, it.x * sx, it.y * sy, r, paint);
                  }
              }
          }
