                          + "Önce 1. adımı yap, sonra 2. adımla başlat, sonra oyuna geç. "
                          + "Ekranda çıkan yuvarlak ON/OFF düğmesine dokunarak simgeleri açıp kapatırsın. "
                          + "Düğmeyi basılı tutarsan bu ekran açılır, sürüklersen yerini değiştirirsin.", 15, false);

                  status = label(root, "", 16, true);

                  button(root, "1. Diğer uygulamaların üstünde gösterme iznini ver", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      }
                  });
                  button(root, "2. Başlat (ekran yakalama izni sorulur, TÜM EKRAN seç)", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          if (!Settings.canDrawOverlays(MainActivity.this)) {
                              Toast.makeText(MainActivity.this, "Önce 1. adımdaki izni ver", Toast.LENGTH_LONG).show();
                              return;
                          }
                          MediaProjectionManager m = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                          startActivityForResult(m.createScreenCaptureIntent(), REQ_CAPTURE);
                      }
                  });
                  button(root, "Durdur", new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          stopService(new Intent(MainActivity.this, CaptureService.class));
                          Toast.makeText(MainActivity.this, "Durduruldu", Toast.LENGTH_SHORT).show();
                      }
                  });

                  label(root, "Simge stili", 18, true);
                  RadioGroup styles = new RadioGroup(this);
                  String[] styleNames = {"Şekiller", "Harfler", "Sayılar"};
                  int curStyle = prefs.getInt("stil", 0);
                  for (int i = 0; i < styleNames.length; i++) {
                      RadioButton rb = new RadioButton(this);
                      rb.setText(styleNames[i]);
                      rb.setTextColor(0xFFFFFFFF);
                      rb.setId(100 + i);
                      styles.addView(rb);
                      if (i == curStyle) rb.setChecked(true);
                  }
                  styles.setOnCheckedChangeListener(new RadioGroup.OnCheckedChangeListener() {
                      @Override
                      public void onCheckedChanged(RadioGroup g, int id) {
                          prefs.edit().putInt("stil", id - 100).apply();
                      }
                  });
                  root.addView(styles);

                  final TextView sizeLabel = label(root, "", 18, true);
                  SeekBar size = new SeekBar(this);
                  size.setMax(100);
                  int curSize = prefs.getInt("boyut", 100);
                  size.setProgress(curSize - 60);
                  sizeLabel.setText("Simge boyutu: %" + curSize);
                  size.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int progress, boolean fromUser) {
                          int v = 60 + progress;
                          sizeLabel.setText("Simge boyutu: %" + v);
                          prefs.edit().putInt("boyut", v).apply();
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar s) { }

                      @Override
                      public void onStopTrackingTouch(SeekBar s) { }
                  });
                  root.addView(size);

                  label(root, "Yenileme hızı", 18, true);
                  RadioGroup speeds = new RadioGroup(this);
                  String[] speedNames = {"Yavaş (serin, 4/sn)", "Orta (6/sn)", "Hızlı (10/sn, ısıtır)"};
                  int curSpeed = prefs.getInt("hiz", 1);
                  for (int i = 0; i < speedNames.length; i++) {
                      RadioButton rb = new RadioButton(this);
                      rb.setText(speedNames[i]);
                      rb.setTextColor(0xFFFFFFFF);
                      rb.setId(200 + i);
                      speeds.addView(rb);
                      if (i == curSpeed) rb.setChecked(true);
                  }
                  speeds.setOnCheckedChangeListener(new RadioGroup.OnCheckedChangeListener() {
                      @Override
                      public void onCheckedChanged(RadioGroup g, int id) {
                          prefs.edit().putInt("hiz", id - 200).apply();
                      }
                  });
                  root.addView(speeds);

                  label(root, "Simge listesi", 18, true);
                  root.addView(new LegendView(this));

                  setContentView(sv);

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, REQ_NOTIF);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  status.setText(Settings.canDrawOverlays(this)
                          ? "Üstte gösterme izni: VAR"
                          : "Üstte gösterme izni: YOK (1. adımı yap)");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != REQ_CAPTURE) return;
                  if (res == RESULT_OK && data != null) {
                      Intent s = new Intent(this, CaptureService.class);
                      s.putExtra("code", res);
                      s.putExtra("data", data);
                      startForegroundService(s);
                      Toast.makeText(this, "Başladı. Oyuna geçip ON/OFF düğmesini kullan.", Toast.LENGTH_LONG).show();
                      moveTaskToBack(true);
                  } else {
                      Toast.makeText(this, "Ekran yakalama izni verilmedi", Toast.LENGTH_LONG).show();
                  }
              }

              /** 12 rengin simgesini ve adini listeler. */
              static final class LegendView extends View {
                  private final Paint shapePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint textPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint bgPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final int rowH;

                  LegendView(Context c) {
                      super(c);
                      rowH = Math.round(56 * c.getResources().getDisplayMetrics().density);
                      textPaint.setColor(0xFFFFFFFF);
                      textPaint.setTextSize(rowH * 0.32f);
                      bgPaint.setColor(0xFF7A7A7A);
                  }

                  @Override
                  protected void onMeasure(int wSpec, int hSpec) {
                      setMeasuredDimension(View.MeasureSpec.getSize(wSpec), rowH * Detector.NCLS);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      SharedPreferences pr = getContext().getSharedPreferences("ayar", Context.MODE_PRIVATE);
                      int st = pr.getInt("stil", 0);
                      for (int k = 1; k <= Detector.NCLS; k++) {
                          float cy = (k - 1) * rowH + rowH / 2f;
                          float cx = rowH * 0.6f;
                          c.drawCircle(cx, cy, rowH * 0.44f, bgPaint);
                          SymbolPainter.draw(c, k, st, cx, cy, rowH * 0.3f, shapePaint);
                          String line = SymbolPainter.NAMES[k] + "  (" + SymbolPainter.SHAPE_NAMES[k] + ", "
                                  + SymbolPainter.LETTERS[k] + ", " + k + ")";
                          c.drawText(line, rowH * 1.3f, cy - (textPaint.descent() + textPaint.ascent()) / 2f, textPaint);
                      }
                  }
              }
          }
          EOF_10

      - name: Android lisanslari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RenkAyirt-APK
          path: app/build/outputs/apk/debug/*.apk
