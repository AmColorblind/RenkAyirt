          package com.renkayirt.oyun;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.media.Image;
          import android.media.ImageReader;
          import android.media.projection.MediaProjection;
          import android.media.projection.MediaProjectionManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.IBinder;
          import android.os.Process;
          import android.os.SystemClock;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Toast;

          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.IntBuffer;
          import java.util.Collections;
          import java.util.List;

          /** Ekrani kucuk boyutta yakalar, renkleri bulur, ust katmana semboller cizer. */
          public class CaptureService extends Service {

              static final String ACTION_STOP = "com.renkayirt.oyun.STOP";
              private static final String CHANNEL = "renkayirt";
              private static final int CAP_W = 360;

              private MediaProjection projection;
              private VirtualDisplay virtualDisplay;
              private ImageReader reader;
              private HandlerThread thread;
              private Handler bg;
              private WindowManager wm;
              private OverlayView overlay;
              private FloatButton button;
              private WindowManager.LayoutParams buttonParams;
              private Detector detector;
              private SharedPreferences prefs;
              private int capW;
              private int capH;
              private int realW;
              private int realH;
              private int[] pixels;
              private int[] rowBuf;
              private int lastHash;
              private volatile boolean hasHash;
              private volatile int emptyStreak;
              private long lastProc;
              private boolean destroyed;
              private volatile boolean symbolsOn = true;
              private volatile float[] discsA = new float[0];
              private volatile float[] discsB = new float[0];

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null && ACTION_STOP.equals(intent.getAction())) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  if (intent == null || projection != null) return START_NOT_STICKY;
                  try {
                      startForegroundNow();
                      int code = intent.getIntExtra("code", 0);
                      Intent data = readData(intent);
                      if (data == null) {
                          stopSelf();
                          return START_NOT_STICKY;
                      }
                      prefs = getSharedPreferences("ayar", Context.MODE_PRIVATE);
                      thread = new HandlerThread("renkayirt-yakala", Process.THREAD_PRIORITY_BACKGROUND);
                      thread.start();
                      bg = new Handler(thread.getLooper());

                      MediaProjectionManager mpm = (MediaProjectionManager) getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      projection = mpm.getMediaProjection(code, data);
                      if (projection == null) {
                          stopSelf();
                          return START_NOT_STICKY;
                      }
                      projection.registerCallback(new MediaProjection.Callback() {
                          @Override
                          public void onStop() {
                              if (!destroyed) stopSelf();
                          }
                      }, bg);

                      wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                      DisplayMetrics dm = new DisplayMetrics();
                      getRealMetrics(dm);
                      realW = dm.widthPixels;
                      realH = dm.heightPixels;
                      capW = CAP_W;
                      capH = Math.max(100, Math.round(realH * (float) CAP_W / realW));
                      pixels = new int[capW * capH];
                      rowBuf = new int[capW];
                      detector = new Detector(capW, capH);

                      addOverlay();
                      addButton();

                      reader = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2);
                      reader.setOnImageAvailableListener(new ImageReader.OnImageAvailableListener() {
                          @Override
                          public void onImageAvailable(ImageReader r) {
                              onFrame(r);
                          }
                      }, bg);
                      virtualDisplay = projection.createVirtualDisplay("RenkAyirt", capW, capH, dm.densityDpi,
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.getSurface(), null, bg);
                  } catch (Exception e) {
                      Toast.makeText(this, "Başlatılamadı: " + e.getClass().getSimpleName(), Toast.LENGTH_LONG).show();
                      stopSelf();
                  }
                  return START_NOT_STICKY;
              }

              @SuppressWarnings("deprecation")
              private static Intent readData(Intent intent) {
                  return intent.getParcelableExtra("data");
              }

              @SuppressWarnings("deprecation")
              private void getRealMetrics(DisplayMetrics dm) {
                  wm.getDefaultDisplay().getRealMetrics(dm);
              }

              private void startForegroundNow() {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(CHANNEL, "RenkAyırt", NotificationManager.IMPORTANCE_LOW));
                  Intent stop = new Intent(this, CaptureService.class);
                  stop.setAction(ACTION_STOP);
                  PendingIntent pi = PendingIntent.getService(this, 0, stop, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification n = new Notification.Builder(this, CHANNEL)
                          .setContentTitle("RenkAyırt çalışıyor")
                          .setContentText("Durdurmak için bu bildirime dokun")
                          .setSmallIcon(android.R.drawable.ic_menu_view)
                          .setContentIntent(pi)
                          .build();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION);
                  } else {
                      startForeground(1, n);
                  }
              }

              private void addOverlay() {
                  overlay = new OverlayView(this);
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  lp.alpha = 0.8f;
                  if (Build.VERSION.SDK_INT >= 28) {
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
                  wm.addView(overlay, lp);
              }

              private void addButton() {
                  int size = Math.round(52 * getResources().getDisplayMetrics().density);
                  buttonParams = new WindowManager.LayoutParams(size, size,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  buttonParams.gravity = Gravity.TOP | Gravity.START;
                  buttonParams.x = Math.round(realW * 0.02f);
                  buttonParams.y = Math.round(realH * 0.20f);
                  button = new FloatButton(this);
                  wm.addView(button, buttonParams);
              }

              void toggle() {
                  symbolsOn = !symbolsOn;
                  hasHash = false;
                  emptyStreak = 0;
                  if (!symbolsOn) {
                      discsA = new float[0];
                      discsB = new float[0];
                      overlay.update(Collections.<Detector.Item>emptyList(), capW, capH, 0, 1f);
                  }
                  button.invalidate();
              }

              void openSettings() {
                  Intent i = new Intent(this, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(i);
              }

              private void onFrame(ImageReader r) {
                  Image img = null;
                  try {
                      img = r.acquireLatestImage();
                      if (img == null) return;
                      int speed = prefs.getInt("hiz", 1);
                      long gap = speed == 0 ? 250 : (speed == 1 ? 165 : 100);
                      if (emptyStreak > 4) gap *= 3; // oyun ekrani degilse seyrek tara (isinmayi azaltir)
                      long now = SystemClock.uptimeMillis();
                      if (now - lastProc < gap) return;
                      lastProc = now;
                      if (!symbolsOn) return;

                      Image.Plane plane = img.getPlanes()[0];
                      ByteBuffer buf = plane.getBuffer();
                      buf.order(ByteOrder.nativeOrder());
                      IntBuffer ib = buf.asIntBuffer();
                      int rowInts = plane.getRowStride() / 4;
                      int hash = 17;
                      for (int y = 0; y < capH; y++) {
                          ib.position(y * rowInts);
                          ib.get(rowBuf, 0, capW);
                          int o = y * capW;
                          for (int x = 0; x < capW; x++) {
                              int v = rowBuf[x]; // bellekte R,G,B,A sirasi: int olarak A B G R
                              int px = 0xFF000000 | (v & 0xFF00) | ((v & 0xFF) << 16) | ((v >> 16) & 0xFF);
                              pixels[o + x] = px;
                              hash = hash * 31 + px;
                          }
                      }
                      if (hasHash && hash == lastHash) return; // ekran ayni, bos yere tarama yapma
                      lastHash = hash;
                      hasHash = true;

                      float[] a = discsA;
                      float[] b = discsB;
                      float[] all = new float[a.length + b.length];
                      System.arraycopy(a, 0, all, 0, a.length);
                      System.arraycopy(b, 0, all, a.length, b.length);
                      detector.setSymbolDiscs(all, all.length / 3);

                      List<Detector.Item> items = detector.detect(pixels);
                      if (items.isEmpty()) emptyStreak++; else emptyStreak = 0;
                      int style = prefs.getInt("stil", 0);
                      float sf = prefs.getInt("boyut", 100) / 100f;
                      float[] nd = new float[items.size() * 3];
                      for (int i = 0; i < items.size(); i++) {
                          Detector.Item it = items.get(i);
                          nd[i * 3] = it.x;
                          nd[i * 3 + 1] = it.y;
                          nd[i * 3 + 2] = Detector.symbolRadius(it, sf);
                      }
                      discsB = discsA;
                      discsA = nd;
                      if (symbolsOn) overlay.update(items, capW, capH, style, sf);
                  } catch (Exception e) {
                      // tek kare hatasi onemsiz, sonraki kare denenir
                  } finally {
                      if (img != null) img.close();
                  }
              }

              @Override
              public void onDestroy() {
                  destroyed = true;
                  super.onDestroy();
                  try {
                      if (reader != null) reader.setOnImageAvailableListener(null, null);
                  } catch (Exception e) {
                      // yoksay
                  }
                  if (virtualDisplay != null) {
                      virtualDisplay.release();
                      virtualDisplay = null;
                  }
                  if (reader != null) {
                      reader.close();
                      reader = null;
                  }
                  if (projection != null) {
                      try {
                          projection.stop();
                      } catch (Exception e) {
                          // yoksay
                      }
                      projection = null;
                  }
                  if (wm != null) {
                      try {
                          if (overlay != null) wm.removeView(overlay);
                      } catch (Exception e) {
                          // yoksay
                      }
                      try {
                          if (button != null) wm.removeView(button);
                      } catch (Exception e) {
                          // yoksay
                      }
                  }
                  if (thread != null) {
                      thread.quitSafely();
                      thread = null;
                  }
              }

              /** Surukulebilen kucuk ac/kapa dugmesi. Dokun: ac/kapa. Uzun bas: ayarlar. */
              static final class FloatButton extends View {
                  private final CaptureService svc;
                  private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private float downX;
                  private float downY;
                  private int startX;
                  private int startY;
                  private long downTime;
                  private boolean dragging;

                  FloatButton(CaptureService s) {
                      super(s);
                      svc = s;
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      float w = getWidth();
                      float cx = w / 2f;
                      float r = w / 2f - 3f;
                      p.setStyle(Paint.Style.FILL);
                      p.setColor(0xFF202020);
                      c.drawCircle(cx, cx, r, p);
                      p.setStyle(Paint.Style.STROKE);
                      p.setColor(0xFFFFFFFF);
                      p.setStrokeWidth(svc.symbolsOn ? w * 0.12f : w * 0.04f);
                      c.drawCircle(cx, cx, r - w * 0.06f, p);
                      p.setStyle(Paint.Style.FILL);
                      p.setTextAlign(Paint.Align.CENTER);
                      p.setFakeBoldText(true);
                      p.setTextSize(w * 0.3f);
                      c.drawText(svc.symbolsOn ? "ON" : "OFF", cx, cx - (p.descent() + p.ascent()) / 2f, p);
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              downX = e.getRawX();
                              downY = e.getRawY();
                              startX = svc.buttonParams.x;
                              startY = svc.buttonParams.y;
                              downTime = SystemClock.uptimeMillis();
                              dragging = false;
                              return true;
                          case MotionEvent.ACTION_MOVE: {
                              float dx = e.getRawX() - downX;
                              float dy = e.getRawY() - downY;
                              if (!dragging && Math.hypot(dx, dy) > 20) dragging = true;
                              if (dragging) {
                                  svc.buttonParams.x = startX + Math.round(dx);
                                  svc.buttonParams.y = startY + Math.round(dy);
                                  svc.wm.updateViewLayout(this, svc.buttonParams);
                              }
                              return true;
                          }
                          case MotionEvent.ACTION_UP:
                              if (!dragging) {
                                  if (SystemClock.uptimeMillis() - downTime > 700) svc.openSettings();
                                  else svc.toggle();
                              }
                              return true;
                          default:
                              return true;
                      }
                  }
              }
          }
